name: Import December review artwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-assets.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import and verify the approved public artwork
        shell: python
        run: |
          import hashlib, http.cookiejar, pathlib, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from time import sleep
          origin = 'https://taisun-december-2026-review.aimassmediahk.chatgpt.site'
          jar = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          client.open(origin + '/api/review/session', timeout=45).read()
          assets = {
              '01.webp': '8f3749e96155ca2bb5a82d6577e7d27b57dad62ea343be144e265335f23678a5',
              '01b.webp': '380ce2bfbebf673d05716717cd32a3853092552d948b1f4c99d493f3ada814c1',
              '02.webp': '881f407bcb7af7bb45ab9d44580960af41e6ae059f0ec08b465b9f46a0b9b3cc',
              '04.webp': 'e7f43548636b0c7ef81b6cca164d0c09b64373c6940451ba251d526ce401e0d4',
              '07.webp': '24ab6fff763f0520e6c7940b2eefebec87b795d5945ff6893a24141c7eace9d5',
              '08.webp': '13d94ea9199e3a67d2af51700b9651548b91be0c5aa841be60d749714e38d609',
              '10.webp': '2c913d840759a086a6b1426b44406fd77fe79066c06f6df688d25e9eba8eaebf',
              '11.webp': '486a197523d35a6c081294821393b50cfc39f938f9cec18c029d8f6ef0da9a1d',
              '12.webp': '447497703f98026570605bb08fc51da2cee80ca9627427bcfc6954d2f8f9b763',
              '12b.webp': '8eef0c4584099a3d6bf0bef67e2b975c6e5aa21671342d593bc28aa6af03914e',
              '12c.webp': '0693fbf34fd8f392fb9d33adbe44e8092714c2edd718a46a1de5e768f92ed86e',
              'r03.webp': '9034c47457828b8762b081d8ae53630a1ebaa87cf15afd7406672cff363b0b50',
              'r05.webp': '0d382725bb5c3a7ff841fb751f834ca4821b80d6a38b1a62a405abac5b7b83fb',
              'r06.webp': '6652d7c7b585024b35dea01604034111352ed3f82a608e5bb16db846591f891b',
              'r09.webp': '95528286d8ac496453c826ab4eda64fe327775ae414dc4c3a094620b51d58518',
          }
          folder = pathlib.Path('media')
          folder.mkdir(exist_ok=True)
          def fetch(item):
              name, digest = item
              target = folder / name
              if target.exists() and hashlib.sha256(target.read_bytes()).hexdigest() == digest:
                  return
              for attempt in range(3):
                  try:
                      data = client.open(origin + '/assets/' + digest + '.webp', timeout=60).read()
                      if hashlib.sha256(data).hexdigest() != digest:
                          raise ValueError('Unexpected artwork for ' + name)
                      target.write_bytes(data)
                      return
                  except Exception:
                      if attempt == 2:
                          raise
                      sleep(3)
          with ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(fetch, assets.items()))
      - name: Save the artwork in this repository
        run: |
          git add -- media
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add 15 verified December review images'
            git push
          fi
